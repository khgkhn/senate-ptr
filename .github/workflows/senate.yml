name: senate-ptr
on:
  schedule:
    - cron: "30 23 * * *"     # 매일 08:30 KST
  workflow_dispatch:
  push:                       # 코드를 고쳐 올리면 바로 한 번 돈다(데이터 커밋은 경로가 달라 안 걸림)
    paths: [senate.py, .github/workflows/senate.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python senate.py
      - name: commit
        run: |
          git config user.name "senate-bot"
          git config user.email "senate-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%F)"
          git push
